name: sudoku_duel
description: A polished single-player Sudoku game, architected for future 1v1 multiplayer.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  audioplayers: ^6.5.0
  flutter_webrtc: ^1.6.2+hotfix.3
  qr_flutter: ^4.1.0
  archive: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
